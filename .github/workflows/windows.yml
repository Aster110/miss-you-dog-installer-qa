name: Test published Windows installer
on:
  workflow_dispatch:
    inputs:
      sha256:
        description: SHA256 of the published installer
        required: true
        default: 6091cc31d063dd24b0f70474bd147d7fe58eca1b8aa6aae00c34ecc0f4f89aa0
permissions:
  contents: read
jobs:
  native-installer:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Install and exercise published desktop application
        shell: pwsh -NoProfile -Sta -File {0}
        env:
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          $ErrorActionPreference='Stop'
          $url='https://dog.xxlai.cc/miss-you-dog-0.1.0-windows-x64.exe'
          if($env:EXPECTED_SHA256 -notmatch '^[a-fA-F0-9]{64}$'){throw 'Invalid checksum input'}
          $installer=Join-Path $env:RUNNER_TEMP 'missdog-setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $env:EXPECTED_SHA256.ToLowerInvariant()){throw 'Installer SHA mismatch'}
          $installDir=Join-Path $env:RUNNER_TEMP 'missdog-installed'
          $setup=Start-Process -FilePath $installer -ArgumentList '/S',"/D=$installDir" -Wait -PassThru
          if($setup.ExitCode -ne 0){throw "Installer failed: $($setup.ExitCode)"}
          $exe=(Get-ChildItem $installDir -Recurse -Filter miss-you-dog.exe | Select-Object -First 1).FullName
          if(-not $exe){throw 'Installed executable missing'}
          $config=Join-Path $env:APPDATA 'cc.xxlai.miss-you-dog'
          New-Item -ItemType Directory -Force $config | Out-Null
          $runtimeFile=Join-Path $config 'runtime.json'
          $stateFile=Join-Path $config 'state.json'
          $runPath='HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $runName='想念小狗'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS='--force-renderer-accessibility'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWindow {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, System.Text.StringBuilder b, int n);
            [StructLayout(LayoutKind.Sequential)] public struct Point { public int X; public int Y; }
            [DllImport("user32.dll")] public static extern bool GetCursorPos(out Point p);
            [DllImport("user32.dll")] public static extern short GetAsyncKeyState(int key);
            [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(Point p);
            [DllImport("user32.dll")] public static extern IntPtr GetAncestor(IntPtr h, uint flags);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
          }
          '@
          $script:app=$null
          function Stop-TestApp {
            if($script:app -and -not $script:app.HasExited){Stop-Process -Id $script:app.Id -Force; $script:app.WaitForExit(5000) | Out-Null}
          }
          function Start-TestApp([Nullable[bool]]$autostart,[bool]$dnd) {
            Stop-TestApp
            if($null -eq $autostart){Remove-Item $stateFile -ErrorAction SilentlyContinue}
            else {@{settings=@{autostart=[bool]$autostart;dnd=$dnd;always_on_top=$true}} | ConvertTo-Json -Depth 5 | Set-Content -Path $stateFile -Encoding utf8}
            Remove-Item $runtimeFile -ErrorAction SilentlyContinue
            $script:app=Start-Process -FilePath $exe -PassThru
          }
          function Write-Diagnostics {
            $fg=[NativeWindow]::GetForegroundWindow();$class=[System.Text.StringBuilder]::new(256)
            [NativeWindow]::GetClassName($fg,$class,256) | Out-Null
            $diag=[ordered]@{foreground_hwnd=$fg.ToInt64();foreground_class=$class.ToString();config=$config;files=@();runtime=$null;app_pid=$script:app.Id;main_window=$script:app.MainWindowTitle}
            if(Test-Path $config){$diag.files=@(Get-ChildItem $config | Select-Object Name,Length)}
            if(Test-Path $runtimeFile){try{$diag.runtime=Get-Content $runtimeFile -Raw | ConvertFrom-Json}catch{}}
            foreach($name in @('startup.json','panel-error.json','drag.json')){
              $file=Join-Path $config $name
              if(Test-Path $file){try{$diag[$name]=Get-Content $file -Raw | ConvertFrom-Json}catch{}}
            }
            try {
              $pc=[System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$script:app.Id)
              $ownWindows=[System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children,$pc)
              $diag.ui=@()
              foreach($window in $ownWindows){
                $diag.ui+=@{name=$window.Current.Name;offscreen=$window.Current.IsOffscreen}
                $controls=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
                foreach($control in $controls){
                  if($control.Current.ControlType -in @([System.Windows.Automation.ControlType]::Button,[System.Windows.Automation.ControlType]::Edit)){
                    $diag.ui+=@{name=$control.Current.Name;type=$control.Current.ControlType.ProgrammaticName;offscreen=$control.Current.IsOffscreen}
                  }
                }
              }
            } catch {$diag.ui_error=$_.Exception.Message}
            $diag.run_value=Get-RunValue
            $diag.machine_run_value=Get-MachineRunValue
            Write-Host ('QA_DIAGNOSTIC '+($diag|ConvertTo-Json -Depth 8 -Compress))
          }
          function Pointer-Sample([string]$phase) {
            $p=[NativeWindow+Point]::new();$ok=[NativeWindow]::GetCursorPos([ref]$p)
            $h=[NativeWindow]::WindowFromPoint($p);[uint32]$target=0
            [NativeWindow]::GetWindowThreadProcessId($h,[ref]$target) | Out-Null
            $root=[NativeWindow]::GetAncestor($h,2);[uint32]$rootPid=0
            [NativeWindow]::GetWindowThreadProcessId($root,[ref]$rootPid) | Out-Null
            $row=@{root_pid=$rootPid;phase=$phase;cursor_read=$ok;x=$p.X;y=$p.Y;left_down=([NativeWindow]::GetAsyncKeyState(1) -lt 0);target_pid=$target;app_pid=$script:app.Id}
            Write-Host ('QA_POINTER '+($row|ConvertTo-Json -Compress))
            return $row
          }
          function Wait-Runtime([scriptblock]$condition,[int]$seconds=25) {
            $deadline=[DateTime]::UtcNow.AddSeconds($seconds)
            while([DateTime]::UtcNow -lt $deadline){
              [System.Windows.Forms.Application]::DoEvents()
              if($script:app.HasExited){throw 'Application exited'}
              if(Test-Path $runtimeFile){
                try {$r=Get-Content $runtimeFile -Raw | ConvertFrom-Json} catch {$r=$null}
                if($r -and $r.pid -eq $script:app.Id -and (& $condition $r)){return $r}
              }
              Start-Sleep -Milliseconds 200
            }
            Write-Diagnostics
            throw 'Native runtime condition timed out'
          }
          function Get-RunValue {
            if(-not (Test-Path $runPath)){return $null}
            $values=Get-ItemProperty -Path $runPath
            $startupEntries=@($values.PSObject.Properties | Where-Object {$_.Value -is [string] -and $_.Value.Contains($exe)})
            if($startupEntries.Count -gt 1){throw 'Multiple user Run entries target this executable'}
            if($startupEntries.Count -eq 0){return $null}
            $script:runName=$startupEntries[0].Name
            return $startupEntries[0].Value
          }
          function Get-MachineRunValue {
            $machinePath='HKLM:\Software\Microsoft\Windows\CurrentVersion\Run'
            if(-not (Test-Path $machinePath)){return $null}
            $values=Get-ItemProperty -Path $machinePath
            @($values.PSObject.Properties | Where-Object {$_.Value -is [string] -and $_.Value.Contains($exe)} | ForEach-Object {$_.Value})
          }
          $result=[ordered]@{installer_sha256=$actual;installer_bytes=(Get-Item $installer).Length;os=(Get-CimInstance Win32_OperatingSystem).Caption;checks=@()}
          try {
            $form=New-Object System.Windows.Forms.Form
            $form.FormBorderStyle=[System.Windows.Forms.FormBorderStyle]::None
            $form.StartPosition=[System.Windows.Forms.FormStartPosition]::Manual
            $normalBounds=[System.Drawing.Rectangle]::new(20,20,80,80)
            $form.Bounds=$normalBounds
            $form.TopMost=$true
            $form.ShowInTaskbar=$false
            $form.Show()
            $form.Activate();[NativeWindow]::SetForegroundWindow($form.Handle) | Out-Null
            Start-TestApp $null $false
            $form.Activate();[NativeWindow]::SetForegroundWindow($form.Handle) | Out-Null
            $r=Wait-Runtime {param($x) $x.autostart -eq $true -and $x.pet_visible -eq $true} 60
            $names=@();$bindVisible=$false;$visibleEdits=0;$bindButton=$null;$edits=@()
            for($i=0;$i -lt 30;$i++){
              $condition=[System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$script:app.Id)
              $windows=[System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children,$condition)
              $names=@();$bindVisible=$false;$visibleEdits=0;$bindButton=$null;$edits=@()
              foreach($w in $windows){
                $names+=$w.Current.Name
                $children=$w.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
                foreach($child in $children){
                  $current=$child.Current;$names+=$current.Name
                  if(-not $current.IsOffscreen -and $current.ControlType -eq [System.Windows.Automation.ControlType]::Edit){$visibleEdits++;$edits+=$child}
                  if(-not $current.IsOffscreen -and $current.ControlType -eq [System.Windows.Automation.ControlType]::Button -and $current.Name -match '领回我的小狗'){$bindVisible=$true;$bindButton=$child}
                }
              }
              if($bindVisible -and $visibleEdits -ge 2){break}
              Start-Sleep -Seconds 1
            }
            if(-not $bindVisible -or $visibleEdits -lt 2){throw 'Visible onboarding Button and two Edit controls absent from UI Automation'}
            # A deliberately invalid code tests the installed WebView -> HK -> D1
            # error path without putting a user identity or credential in this repo.
            foreach($edit in $edits){
              $value=[System.Windows.Automation.ValuePattern]$edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
              if($edit.Current.Name -eq '你的昵称'){$value.SetValue('Windows QA')}
              elseif($edit.Current.Name -eq '主人给你的绑定码'){$value.SetValue('QA-INVALID-DISPOSABLE')}
            }
            ([System.Windows.Automation.InvokePattern]$bindButton.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)).Invoke()
            $networkError=$false
            for($i=0;$i -lt 75;$i++){
              $children=[System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Descendants,$condition)
              foreach($window in $windows){
                $text=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
                foreach($node in $text){if($node.Current.Name -match '绑定码已使用或过期'){$networkError=$true;break}}
              }
              if($networkError){break};Start-Sleep -Milliseconds 200
            }
            if(-not $networkError){throw 'Installed WebView did not receive the expected HK binding response'}
            $result.checks+=@{name='installed_webview_hk_d1_error_path';passed=$true;response='binding code expired or used'}
            $expectedRun='"'+$exe+'"'
            if((Get-RunValue).Trim() -ne $expectedRun){throw 'Default user Run command differs from installed exe'}
            if(Get-MachineRunValue){throw 'Machine-wide autostart must not be created'}
            $result.checks+=@{name='install_default_autostart_and_visible_onboarding';passed=$true;visible_edits=$visibleEdits;visible_bind_button=$bindVisible;main_working_set_bytes=$script:app.WorkingSet64}
            $form.Bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $form.Activate()
            [NativeWindow]::SetForegroundWindow($form.Handle) | Out-Null
            for($i=0;$i -lt 15 -and [NativeWindow]::GetForegroundWindow() -ne $form.Handle;$i++){
              [System.Windows.Forms.Application]::DoEvents()
              $form.Activate();[NativeWindow]::SetForegroundWindow($form.Handle) | Out-Null
              Start-Sleep -Milliseconds 200
            }
            if([NativeWindow]::GetForegroundWindow() -ne $form.Handle){throw 'Fullscreen foreground precondition not established'}
            $r=Wait-Runtime {param($x) $x.foreground_fullscreen -eq $true -and $x.pet_visible -eq $false -and $x.dnd -eq $false}
            $result.checks+=@{name='actual_foreground_fullscreen_hides_pet';passed=$true;pid=$r.pid}
            $form.Bounds=$normalBounds
            $form.Activate();[NativeWindow]::SetForegroundWindow($form.Handle) | Out-Null
            $r=Wait-Runtime {param($x) $x.foreground_fullscreen -eq $false -and $x.pet_visible -eq $true}
            $result.checks+=@{name='fullscreen_exit_restores_pet';passed=$true;pid=$r.pid}
            Start-TestApp $false $false
            $r=Wait-Runtime {param($x) $x.autostart -eq $false}
            if(Get-RunValue){throw 'Disabled autostart still registered'}
            $result.checks+=@{name='saved_autostart_off_removes_registry';passed=$true}
            Start-TestApp $true $true
            $r=Wait-Runtime {param($x) $x.autostart -eq $true -and $x.dnd -eq $true -and $x.pet_visible -eq $false}
            if((Get-RunValue).Trim() -ne $expectedRun){throw 'Enabled user Run command differs from installed exe'}
            $result.checks+=@{name='saved_autostart_on_and_dnd_hide';passed=$true}
            Start-TestApp $true $false
            $r=Wait-Runtime {param($x) $x.dnd -eq $false -and $x.pet_visible -eq $true}
            $result.checks+=@{name='dnd_off_restores_pet';passed=$true}
            # Actual pointer drag on this disposable VM, then read back native position.
            $before=$r.position
            $cursor=[System.Windows.Forms.Cursor]::Position
            $x=[int]$before.x+[int]($r.pet_size.width/2);$y=[int]$before.y+[int]($r.pet_size.height/2)
            [System.Windows.Forms.Cursor]::Position=[System.Drawing.Point]::new($x,$y)
            $point=Pointer-Sample 'before-down'
            if(-not $point.cursor_read -or $point.x -ne $x -or $point.y -ne $y -or $point.root_pid -ne $script:app.Id){throw 'Actual pointer target precondition not established'}
            [NativeWindow]::mouse_event(2,0,0,0,[UIntPtr]::Zero)
            Start-Sleep -Milliseconds 100
            $point=Pointer-Sample 'after-down'
            if(-not $point.left_down){throw 'Actual left-button down precondition not established'}
            for($i=1;$i -le 8;$i++){
              [System.Windows.Forms.Cursor]::Position=[System.Drawing.Point]::new($x-$i*10,$y-$i*6)
              [System.Windows.Forms.Application]::DoEvents();Start-Sleep -Milliseconds 100
            }
            Start-Sleep -Milliseconds 300
            $point=Pointer-Sample 'before-up'
            [NativeWindow]::mouse_event(4,0,0,0,[UIntPtr]::Zero)
            $r=Wait-Runtime {param($x) $x.position.x -ne $before.x -or $x.position.y -ne $before.y}
            $moved=$r.position
            Start-Sleep -Seconds 5
            Start-TestApp $true $false
            $r=Wait-Runtime {param($x) $x.pet_visible -eq $true}
            if($r.position.x -ne $moved.x -or $r.position.y -ne $moved.y){throw 'Dragged position did not survive restart'}
            [System.Windows.Forms.Cursor]::Position=$cursor
            $result.checks+=@{name='actual_pointer_drag_and_position_restart';passed=$true;before=$before;after=$moved;restored=$r.position}
            $result.passed=$true
          } finally {
            try {Write-Diagnostics} catch {Write-Host ('QA_DIAGNOSTIC_ERROR '+$_.Exception.Message)}
            if($form){$form.Close();$form.Dispose()}
            Stop-TestApp
            Remove-ItemProperty -Path $runPath -Name $runName -ErrorAction SilentlyContinue
            Write-Output ('QA_RESULT '+($result | ConvertTo-Json -Depth 8 -Compress))
          }
